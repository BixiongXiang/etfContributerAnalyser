services:
  # ── FastAPI backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: market-attribution-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL uses a path inside the container mapped to a volume
      DATABASE_URL: sqlite+aiosqlite:///./data/market_attribution.db
      # Allow requests from the frontend container
      CORS_ORIGINS: "http://localhost:3000 http://frontend:3000"
    volumes:
      # Named volume so the SQLite file persists across restarts and rebuilds
      - db_data:/app/data
    ports:
      # Expose on localhost only — frontend proxies /api/* to the backend
      - "127.0.0.1:8888:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: market-attribution-frontend
    restart: unless-stopped
    environment:
      # Internal Docker network URL — frontend → backend
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      # Publicly accessible: open http://localhost:3000 (or http://<ec2-ip>:3000)
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
    driver: local
